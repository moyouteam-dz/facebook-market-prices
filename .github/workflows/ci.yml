name: CI

on:
  push:
    branches:
      - main
      - feat/phone-first-webapp
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm install --no-audit --no-fund 2>&1 | tee install.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### npm install failure'
              echo
              echo '```text'
              tail -n 100 install.log
              echo '```'
            } > issue.md
            gh issue comment 1 --body-file issue.md
            exit "$status"
          fi
      - name: Unit tests
        run: npm run test:run
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
