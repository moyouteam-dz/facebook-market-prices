name: CI

on:
  push:
    branches:
      - main
      - feat/phone-first-webapp
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm run test:run
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
